<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>到着時間計算</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#18181b;font-family:system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:14px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:10px}
h1{font-size:19px;margin:0 0 12px}.utc{text-align:center;font-size:28px;font-weight:800}.utc small{display:block;font-size:12px;color:#71717a}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
input,button{width:100%;min-height:43px;border:1px solid #ccc;border-radius:8px;padding:8px;font:inherit}
button{background:#18181b;color:white;font-weight:700;cursor:pointer}.secondary{background:white;color:#18181b}
.row,.radio,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.radio label{border:1px solid #ccc;border-radius:8px;padding:11px;text-align:center;margin:0}.radio input{width:auto;min-height:0}
.item{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:9px 0}.item:first-child{border-top:0}.remove{width:auto;min-height:34px}.result{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:11px;font-family:monospace;line-height:1.7}
.empty{color:#777;font-size:14px}.hint{font-size:12px;color:#777;margin-top:4px}@media(max-width:430px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<section class="card"><h1>到着時間計算</h1><div class="utc"><small>現在のUTC時刻</small><span id="now">--:--:--</span> UTC</div></section>
<section class="card">
<label>到着時間（UTC）</label><input id="arrival" type="time" step="1"><div class="hint">現在UTCから設定</div>
<div class="row"><div><label>名前</label><input id="name"></div><div><label>行軍時間</label><input id="march" inputmode="numeric"></div></div>
<label>集結時間</label><div class="radio">
<label><input type="radio" name="r" value="60" checked> 1分</label>
<label><input type="radio" name="r" value="300"> 5分</label></div>
<button id="add" style="margin-top:10px">追加</button>
</section>
<section class="card"><div id="list" class="empty">登録された人物はありません。</div></section>
<section class="card"><div id="out" class="result">到着時間を設定してください。</div>
<div class="actions" style="margin-top:8px"><button id="calc">再計算</button><button id="copy">コピー</button></div>
<button id="clear" class="secondary" style="margin-top:8px">全削除</button></section>
</main>
<script>
const people=[],$=id=>document.getElementById(id);
function utc(){let d=new Date();return [d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()].map(x=>String(x).padStart(2,'0')).join(':')}
function tick(){$('now').textContent=utc()} tick();setInterval(tick,1000);$('arrival').value=utc();
function dur(x){x=x.trim();if(/^\d+$/.test(x))return +x;let m=x.match(/(\d+)分/),s=x.match(/(\d+)秒/);return (m?+m[1]*60:0)+(s?+s[1]:0)}
function fd(x){return x<60?x+'秒':Math.floor(x/60)+'分'+(x%60?x%60+'秒':'')}
function ts(x){let [h,m,s=0]=x.split(':').map(Number);return h*3600+m*60+s}
function ft(x){x=(x%86400+86400)%86400;return [Math.floor(x/3600),Math.floor(x%3600/60),x%60].map(v=>String(v).padStart(2,'0')).join(':')}
function rl(x){return x==60?'1分':'5分'}
function render(){let l=$('list');if(!people.length){l.className='empty';l.textContent='登録された人物はありません。'}else{l.className='';l.innerHTML=people.map((p,i)=>`<div class="item"><span>${p.name}　${fd(p.march)}/${rl(p.rally)}</span><button class="secondary remove" data-i="${i}">削除</button></div>`).join('');l.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{people.splice(+b.dataset.i,1);render();calc()})}}
function calc(){let a=$('arrival').value;if(!a){$('out').textContent='到着時間を設定してください。';return}let t=ts(a),lines=[a+' UTC'];people.forEach(p=>lines.push(`${p.name} ${fd(p.march)}/${rl(p.rally)} → ${ft(t-p.rally-p.march)}`));$('out').textContent=lines.join('\n')}
$('add').onclick=()=>{let n=$('name').value.trim(),m=dur($('march').value),r=+$('r:checked');r=+(document.querySelector('input[name=r]:checked').value);if(!n||!Number.isFinite(m)){alert('名前と行軍時間を入力してください。');return}people.push({name:n,march:m,rally:r});$('name').value='';$('march').value='';render();calc();$('name').focus()}
$('calc').onclick=calc;$('arrival').oninput=calc;$('clear').onclick=()=>{people.length=0;render();calc()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').textContent);$('copy').textContent='コピーしました';setTimeout(()=>$('copy').textContent='コピー',1000)}catch{alert('コピーできませんでした。')}};
render();calc();
</script></body></html>
